<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <meta name="application-name" content="Prim'O" />
    <meta name="theme-color" content="#00a19a" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prim'O" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/token-logo-SF.png" />

    <!-- SEO (valeurs par défaut ; title, robots et canonical sont ajustés par page via usePageMeta) -->
    <title>PRIM'O — Reconnaissance des équipes en PME</title>
    <meta
      name="description"
      content="PRIM'O permet aux employeurs de PME de récompenser leurs équipes en temps réel avec des jetons, échangeables contre des bons d'achat chez des partenaires."
    />

    <!-- Open Graph / aperçu des liens (les robots de partage n'exécutent pas le JavaScript : valeurs statiques) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRIM'O" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="PRIM'O — Reconnaissance des équipes en PME" />
    <meta
      property="og:description"
      content="Récompensez vos équipes en temps réel avec des jetons échangeables contre des bons d'achat chez des partenaires."
    />
    <meta property="og:url" content="https://prim-o.vercel.app/" />
    <meta property="og:image" content="https://prim-o.vercel.app/icons/icon-512x512.png" />
    <meta property="og:image:alt" content="Logo PRIM'O" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
